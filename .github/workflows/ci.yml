name: check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: 安装依赖
        # pnpm 10 起默认不执行依赖的安装脚本，装完会返回非 0。
        # .npmrc 里的开关在 CI 下不生效，所以这里显式传参。
        run: pnpm install --frozen-lockfile --dangerously-allow-all-builds

      - name: 化学数据校验
        run: pnpm check:data

      - name: 反应判定回归
        run: pnpm check:chem

      - name: 界面渲染冒烟
        run: pnpm check:ui

      - name: 类型检查
        run: pnpm check:types

      - name: 构建
        run: pnpm build
